name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Check tag matches version files
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest=$(node -p "require('./manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          in_versions=$(node -p "Object.hasOwn(require('./versions.json'), '$tag')")
          if [ "$manifest" != "$tag" ] || [ "$pkg" != "$tag" ] || [ "$in_versions" != "true" ]; then
            echo "Tag $tag must match manifest.json ($manifest), package.json ($pkg) and have a versions.json entry ($in_versions)"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Attest release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
